name: Render Notion PNG assets
on:
  push:
    paths:
      - 'organisation/liste-taches/*.svg'
      - '.github/workflows/render-notion-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Generate PNG
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          folder = Path('organisation/liste-taches')
          for name in ('icon','cover'):
              src = folder / f'{name}.svg'
              if src.exists():
                  cairosvg.svg2png(url=str(src),write_to=str(folder/f'{name}.png'))
          PY
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organisation/liste-taches/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Notion PNG assets"
            git push
          fi

name: Render Notion PNG assets
on:
  push:
    paths:
      - '**/*.svg'
      - '.github/workflows/render-notion-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Generate PNG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for source in Path('.').rglob('*.svg'):
              if '.git' in source.parts:
                  continue
              cairosvg.svg2png(url=str(source),write_to=str(source.with_suffix('.png')))
          PY
      - name: Commit PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.png'
          if ! git diff --cached --quiet; then
            git commit -m "Generate Notion PNG assets"
            git push
          fi
